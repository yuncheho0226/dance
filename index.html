<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Sper - Engineer Vsinger Live Stage</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .stage-container {
            text-align: center;
        }

        h3 {
            color: #38bdf8;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.slogan {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* 舞台外框 */
        .stage {
            width: 320px;
            height: 450px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #0ea5e9;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.2);
            margin: 0 auto;
        }

        /* 角色本體：輕快跳躍舞蹈 + 最後翻跟斗循環 */
        #vsingerAvatar {
            width: 240px;
            height: 420px;
            object-fit: contain;
            animation: danceAndFlip 4s infinite ease-in-out;
            transform-origin: center bottom;
        }

        /* 舞步與翻跟斗動畫核心 */
        @keyframes danceAndFlip {
            0%, 75% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            12.5% {
                transform: translateY(-10px) rotate(-2deg) scale(1.02);
            }
            25% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            37.5% {
                transform: translateY(-10px) rotate(2deg) scale(1.02);
            }
            50% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            62.5% {
                transform: translateY(-12px) rotate(-1.5deg) scale(1.03);
            }
            80% {
                transform: translateY(8px) rotate(0deg) scale(0.95, 1.05);
            }
            90% {
                transform: translateY(-70px) rotate(180deg) scale(1.1);
            }
            96% {
                transform: translateY(0) rotate(360deg) scale(1);
            }
            100% {
                transform: translateY(0) rotate(360deg) scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <h3>🎙 SPER STYLE - LIVE STAGE</h3>
        <p class="slogan">"Hello I’m Sper, nice to meet you, I’m a best engineer Vsinger, and we are best friends!"</p>
        
        <div class="stage">
            <!-- 這裡使用了圖片標籤，你可以直接把你的圖片轉成線上網址或 Base64 貼在這裡 -->
            <img id="vsingerAvatar" src="data:image/png;base64,請將你的圖片Base64編碼貼在這裡" alt="Engineer Vsinger">
        </div>
    </div>

</body>
</html>
